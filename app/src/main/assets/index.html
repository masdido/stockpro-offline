<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockPro Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}header{background:#163a5f;color:#fff;padding:16px;position:sticky;top:0;z-index:3}h1{font-size:20px;margin:0}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px;position:sticky;top:52px;z-index:2}nav button{border:0;padding:9px 12px;border-radius:8px;white-space:nowrap}nav .a{background:#163a5f;color:white}
main{padding:12px}.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#eef3f7;padding:12px;border-radius:10px}.stat b{display:block;font-size:17px;margin-top:5px}button{padding:9px;border:0;border-radius:7px}button.primary{background:#163a5f;color:#fff}button.danger{background:#b42318;color:#fff}input,select{width:100%;padding:10px;margin:4px 0 9px;border:1px solid #ccd3da;border-radius:7px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}.muted{font-size:12px;color:#667085}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;padding:12px;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:#fff;padding:16px;border-radius:12px;width:100%;max-width:650px;max-height:90vh;overflow:auto}
</style></head><body><header><h1>StockPro Offline</h1></header><nav id=n></nav><main id=a></main><div id=m class=modal><div id=b class=box></div></div>
<script>
const K='stockpro';let d=JSON.parse(localStorage.getItem(K)||'null')||{set:{att:2500,tactical:0},p:[],c:[],sup:[],buy:[],sale:[],exp:[],tak:[]},page='Dashboard';
const $=x=>document.getElementById(x),save=()=>{localStorage.setItem(K,JSON.stringify(d));render()},fmt=x=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+x||0),id=()=>Date.now()+Math.random();
function P(i){return d.p.find(x=>x.id==i)} function C(i){return d.c.find(x=>x.id==i)}
function stock(p){return (+p.open||0)+d.buy.filter(x=>x.pid==p.id).reduce((a,x)=>a+x.q,0)-d.sale.filter(x=>x.pid==p.id).reduce((a,x)=>a+x.q,0)}
function cost(p){let q=+p.open||0,v=q*(+p.oc||0);d.buy.filter(x=>x.pid==p.id).forEach(x=>{q+=x.q;v+=x.q*x.cost});return q?v/q:0}
function stats(){let t=d.sale.reduce((a,x)=>a+x.total,0),c=d.sale.reduce((a,x)=>a+x.modal,0),att=d.sale.reduce((a,x)=>a+x.att,0),sh=d.sale.reduce((a,x)=>a+x.ship,0),g=t-c,n=d.sale.reduce((a,x)=>a+x.net,0)-d.exp.reduce((a,x)=>a+x.amount,0);return{t,c,att,sh,g,n}}
function nav(){n.innerHTML=['Dashboard','Barang','Pelanggan','Supplier','Pembelian','Penjualan','Pengeluaran','Dana Taktis','Laporan','Backup'].map(x=>`<button class="${x==page?'a':''}" onclick="go('${x}')">${x}</button>`).join('')}
function go(x){page=x;render()}
function render(){nav();a.innerHTML=({Dashboard:dash,Barang:products,Pelanggan:customers,Supplier:suppliers,Pembelian:purchases,Penjualan:sales,Pengeluaran:expenses,'Dana Taktis':tactical,Laporan:reports,Backup:backup}[page])()}
function dash(){let s=stats();return `<div class=grid><div class="card stat">Penjualan<b>${fmt(s.t)}</b></div><div class="card stat">Modal Barang Terjual<b>${fmt(s.c)}</b></div><div class="card stat">Laba Kotor<b>${fmt(s.g)}</b></div><div class="card stat">Laba Bersih<b>${fmt(s.n)}</b></div><div class="card stat">Atensi<b>${fmt(s.att)}</b></div><div class="card stat">Ongkir<b>${fmt(s.sh)}</b></div><div class="card stat">Dana Taktis<b>${fmt(tb())}</b></div></div>`}
function products(){return `<div class=card><button class=primary onclick="pf()">+ Barang</button><div class=table><table><tr><th>Kode</th><th>Nama</th><th>Satuan</th><th>Stok</th><th>Min</th><th>Modal Rata-rata</th><th>Harga Jual</th><th></th></tr>${d.p.map(p=>`<tr><td>${p.code}</td><td>${p.name}</td><td>${p.unit}</td><td>${stock(p)}</td><td>${p.min}</td><td>${fmt(cost(p))}</td><td>${fmt(p.sell)}</td><td><button onclick="pf('${p.id}')">Edit</button> <button class=danger onclick="del('p','${p.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function customers(){return `<div class=card><button class=primary onclick="cf()">+ Pelanggan</button><div class=table><table><tr><th>Nama</th><th>Jenis</th><th>Wilayah</th><th>Telepon</th><th></th></tr>${d.c.map(x=>`<tr><td>${x.name}</td><td>${x.type}</td><td>${x.region}</td><td>${x.phone}</td><td><button onclick="cf('${x.id}')">Edit</button> <button class=danger onclick="del('c','${x.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function suppliers(){return `<div class=card><button class=primary onclick="sf()">+ Supplier</button><div class=table><table><tr><th>Nama</th><th>Telepon</th><th>Alamat</th><th></th></tr>${d.sup.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.address}</td><td><button onclick="sf('${x.id}')">Edit</button> <button class=danger onclick="del('sup','${x.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function purchases(){return `<div class=card><button class=primary onclick="bf()">+ Pembelian</button><div class=table><table><tr><th>Tanggal</th><th>No</th><th>Supplier</th><th>Barang</th><th>Qty</th><th>Harga</th><th></th></tr>${d.buy.map(x=>`<tr><td>${x.date}</td><td>${x.no}</td><td>${(d.sup.find(s=>s.id==x.sid)||{}).name||''}</td><td>${P(x.pid)?.name||''}</td><td>${x.q}</td><td>${fmt(x.cost)}</td><td><button onclick="bf('${x.id}')">Edit</button> <button class=danger onclick="del('buy','${x.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function sales(){return `<div class=card><button class=primary onclick="vf()">+ Penjualan</button><div class=table><table><tr><th>Tanggal</th><th>No</th><th>Pelanggan</th><th>Jenis</th><th>Wilayah</th><th>Barang</th><th>Qty</th><th>Tanggungan</th><th>Laba Bersih</th><th></th></tr>${d.sale.map(x=>`<tr><td>${x.date}</td><td>${x.no}</td><td>${C(x.cid)?.name||''}</td><td>${x.type}</td><td>${C(x.cid)?.region||''}</td><td>${P(x.pid)?.name||''}</td><td>${x.q}</td><td>${fmt(x.ob)}</td><td>${fmt(x.net)}</td><td><button onclick="vf('${x.id}')">Edit</button> <button class=danger onclick="del('sale','${x.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function expenses(){return `<div class=card><button class=primary onclick="ef()">+ Pengeluaran</button><div class=table><table><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th></th></tr>${d.exp.map(x=>`<tr><td>${x.date}</td><td>${x.cat}</td><td>${x.note}</td><td>${fmt(x.amount)}</td><td><button onclick="ef('${x.id}')">Edit</button> <button class=danger onclick="del('exp','${x.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function tb(){return (+d.set.tactical||0)+d.tak.filter(x=>x.type=='Penambahan').reduce((a,x)=>a+x.amount,0)-d.tak.filter(x=>x.type=='Penggunaan').reduce((a,x)=>a+x.amount,0)}
function tactical(){return `<div class=card><b>Dana Taktis Saat Ini: ${fmt(tb())}</b><br><br><button class=primary onclick="tf()">+ Transaksi</button><div class=table><table><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Nominal</th><th></th></tr>${d.tak.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${x.note}</td><td>${fmt(x.amount)}</td><td><button onclick="tf('${x.id}')">Edit</button> <button class=danger onclick="del('tak','${x.id}')">X</button></td></tr>`).join('')}</table></div></div>`}
function reports(){let s=stats();return `<div class=card><h3>Rekap Penghasilan</h3><p>Penjualan Barang: <b>${fmt(s.t)}</b></p><p>Modal Barang Terjual: <b>${fmt(s.c)}</b></p><p>Laba Kotor: <b>${fmt(s.g)}</b></p><p>Atensi: <b>${fmt(s.att)}</b></p><p>Ongkir: <b>${fmt(s.sh)}</b></p><p>Laba Bersih: <b>${fmt(s.n)}</b></p></div><div class=card><h3>Stok</h3><div class=table><table><tr><th>Barang</th><th>Stok</th><th>Minimum</th><th>Modal Rata-rata</th><th>Nilai Stok</th></tr>${d.p.map(p=>`<tr><td>${p.name}</td><td>${stock(p)}</td><td>${p.min}</td><td>${fmt(cost(p))}</td><td>${fmt(stock(p)*cost(p))}</td></tr>`).join('')}</table></div></div>`}
function backup(){return `<div class=card><h3>Backup</h3><button class=primary onclick="ex()">Export JSON</button> <label class=primary style="display:inline-block">Import JSON<input type=file accept=.json onchange="im(event)" style="display:none"></label><hr>Tarif Atensi/Pack<input type=number value="${d.set.att}" onchange="d.set.att=+this.value;save()"></div>`}
function form(title,body,fn){b.innerHTML=`<h3>${title}</h3><form id=f>${body}<button class=primary>Simpan</button></form>`;m.classList.add('show');f.onsubmit=e=>{e.preventDefault();fn(new FormData(f));m.classList.remove('show');save()}}
const I=(l,n,v,r=0,t='text')=>`<label>${l}<input type=${t} name=${n} value="${String(v??'').replace(/"/g,'&quot;')}" ${r?'required':''}></label>`;
const S=(l,n,opts,v)=>`<label>${l}<select name=${n} required><option value="">Pilih...</option>${opts.map(o=>`<option value="${o.id}" ${o.id==v?'selected':''}>${o.name||o.region}</option>`).join('')}</select></label>`;
const D=(l,n,opts,v)=>`<label>${l}<select name=${n}>${opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select></label>`;
function pf(i=''){let x=d.p.find(q=>q.id==i)||{code:'',name:'',unit:'Pack',open:0,oc:0,sell:0,min:0};form(i?'Edit Barang':'Tambah Barang',I('Kode','code',x.code,1)+I('Nama','name',x.name,1)+I('Satuan','unit',x.unit,1)+I('Stok Awal','open',x.open,0,'number')+I('Harga Kulak Awal','oc',x.oc,0,'number')+I('Harga Jual Default','sell',x.sell,0,'number')+I('Stok Minimum','min',x.min,0,'number'),f=>{let o={id:i||id(),code:f.get('code'),name:f.get('name'),unit:f.get('unit'),open:+f.get('open')||0,oc:+f.get('oc')||0,sell:+f.get('sell')||0,min:+f.get('min')||0};let j=d.p.findIndex(x=>x.id==o.id);j<0?d.p.push(o):d.p[j]=o})}
function cf(i=''){let x=d.c.find(q=>q.id==i)||{name:'',type:'Biasa',region:'',phone:'',address:''};form(i?'Edit Pelanggan':'Tambah Pelanggan',I('Nama','name',x.name,1)+D('Jenis','type',['Biasa','Special'],x.type)+I('Wilayah','region',x.region,1)+I('Telepon','phone',x.phone)+I('Alamat','address',x.address),f=>{let o={id:i||id(),name:f.get('name'),type:f.get('type'),region:f.get('region'),phone:f.get('phone'),address:f.get('address')};let j=d.c.findIndex(x=>x.id==o.id);j<0?d.c.push(o):d.c[j]=o})}
function sf(i=''){let x=d.sup.find(q=>q.id==i)||{name:'',phone:'',address:''};form(i?'Edit Supplier':'Tambah Supplier',I('Nama','name',x.name,1)+I('Telepon','phone',x.phone)+I('Alamat','address',x.address),f=>{let o={id:i||id(),name:f.get('name'),phone:f.get('phone'),address:f.get('address')};let j=d.sup.findIndex(x=>x.id==o.id);j<0?d.sup.push(o):d.sup[j]=o})}
function bf(i=''){let x=d.buy.find(q=>q.id==i)||{date:'',no:'',sid:'',pid:'',q:1,cost:0};form(i?'Edit Pembelian':'Tambah Pembelian',I('Tanggal','date',x.date,1,'date')+I('No Pembelian','no',x.no,1)+S('Supplier','sid',d.sup,x.sid)+S('Barang','pid',d.p,x.pid)+I('Jumlah','q',x.q,1,'number')+I('Harga Kulak/Unit','cost',x.cost,1,'number'),f=>{let o={id:i||id(),date:f.get('date'),no:f.get('no'),sid:f.get('sid'),pid:f.get('pid'),q:+f.get('q'),cost:+f.get('cost')};let j=d.buy.findIndex(x=>x.id==o.id);j<0?d.buy.push(o):d.buy[j]=o})}
function vf(i=''){let x=d.sale.find(q=>q.id==i)||{date:'',no:'',cid:'',pid:'',q:1,price:0,ship:0};form(i?'Edit Penjualan':'Tambah Penjualan',I('Tanggal','date',x.date,1,'date')+I('No Pesanan','no',x.no,1)+S('Pelanggan','cid',d.c,x.cid)+S('Barang','pid',d.p,x.pid)+I('Jumlah','q',x.q,1,'number')+I('Harga Jual/Unit','price',x.price,1,'number')+I('Biaya Ongkir','ship',x.ship,0,'number'),f=>{let p=P(f.get('pid')),c=C(f.get('cid')),q=+f.get('q'),price=+f.get('price'),ship=+f.get('ship')||0,old=d.sale.find(z=>z.id==i),av=stock(p)+(old&&old.pid==p.id?old.q:0);if(q>av){alert('Stok tidak mencukupi.');throw 0}let modal=q*cost(p),total=q*price,att=q*d.set.att,gross=total-modal,ob=c.type=='Biasa'?total+ship:total,net=gross-att-(c.type=='Special'?ship:0);let o={id:i||id(),date:f.get('date'),no:f.get('no'),cid:c.id,type:c.type,pid:p.id,q,price,ship,total,modal,att,gross,ob,net};let j=d.sale.findIndex(z=>z.id==o.id);j<0?d.sale.push(o):d.sale[j]=o})}
function ef(i=''){let x=d.exp.find(q=>q.id==i)||{date:'',cat:'Operasional',note:'',amount:0};form(i?'Edit Pengeluaran':'Tambah Pengeluaran',I('Tanggal','date',x.date,1,'date')+D('Kategori','cat',['Operasional','Transportasi','Gaji','Listrik','Internet','Lainnya'],x.cat)+I('Keterangan','note',x.note)+I('Nominal','amount',x.amount,1,'number'),f=>{let o={id:i||id(),date:f.get('date'),cat:f.get('cat'),note:f.get('note'),amount:+f.get('amount')};let j=d.exp.findIndex(x=>x.id==o.id);j<0?d.exp.push(o):d.exp[j]=o})}
function tf(i=''){let x=d.tak.find(q=>q.id==i)||{date:'',type:'Penggunaan',note:'',amount:0};form('Dana Taktis',I('Tanggal','date',x.date,1,'date')+D('Jenis','type',['Penambahan','Penggunaan'],x.type)+I('Keterangan','note',x.note)+I('Nominal','amount',x.amount,1,'number'),f=>{let amount=+f.get('amount');if(f.get('type')=='Penggunaan'&&amount>tb()){alert('Dana Taktis tidak mencukupi.');throw 0}let o={id:i||id(),date:f.get('date'),type:f.get('type'),note:f.get('note'),amount};let j=d.tak.findIndex(x=>x.id==o.id);j<0?d.tak.push(o):d.tak[j]=o})}
function del(k,i){if(confirm('Hapus?')){d[k]=d[k].filter(x=>x.id!=i);save()}}
function ex(){let z=new Blob([JSON.stringify(d)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(z);a.download='stockpro-backup.json';a.click()}
function im(e){let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();alert('Berhasil')}catch(_){alert('File tidak valid')}};r.readAsText(e.target.files[0])}
render();
</script></body></html>
